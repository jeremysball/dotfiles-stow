# himalaya config — wired to local Proton Mail Bridge (127.0.0.1)
# Bridge runs cleartext IMAP/SMTP on localhost; it terminates the TLS to
# Proton's servers itself, so the local hop uses encryption = "none".
#
# The bridge password (NOT your Proton login password) is fetched at runtime
# from the `pass` store so it never lives in this file:
#   pass show mail/proton-bridge

[accounts.proton]
default = true
display-name = "Jeremy Ball"
email = "jeremysball@pm.me"

# --- IMAP backend (reading) ---
backend.type = "imap"
backend.host = "127.0.0.1"
backend.port = 1143
backend.encryption.type = "none"
backend.login = "jeremysball@pm.me"
backend.auth.type = "password"
backend.auth.cmd = "pass show mail/proton-bridge"

# --- SMTP backend (sending) ---
message.send.backend.type = "smtp"
message.send.backend.host = "127.0.0.1"
message.send.backend.port = 1025
message.send.backend.encryption.type = "none"
message.send.backend.login = "jeremysball@pm.me"
message.send.backend.auth.type = "password"
message.send.backend.auth.cmd = "pass show mail/proton-bridge"

# --- Folder aliases ---
folder.aliases.inbox = "INBOX"
folder.aliases.sent = "Sent"
folder.aliases.drafts = "Drafts"
folder.aliases.trash = "Trash"