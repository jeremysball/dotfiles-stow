name: check-mise-env-and-themes

# Mirrors the local pre-commit hook in .githooks/pre-commit (which only
# fires when `git config core.hooksPath .githooks` is set on this clone).
# Runs the --tracked-only variant so the env-file check (which reads
# $XDG_RUNTIME_DIR/secrets/) is skipped on a fresh CI runner, and the
# runtime symlink check (which assumes the user has already run
# `mise bootstrap dotfiles apply`) is skipped too. CI verifies the source
# files in the dotfiles repo: tracked theme JSON under
# .config/{kilo,opencode}/themes/ is valid opencode theme JSON, and the
# [dotfiles] table entries the runtime symlinks depend on are still
# present in .config/mise/config.toml.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/check-mise-env-and-themes.sh'
      - '.config/mise/config.toml'
      - '.config/kilo/themes/**'
      - '.config/opencode/themes/**'
      - '.github/workflows/check-mise-env-and-themes.yml'
  pull_request:
    paths:
      - 'scripts/check-mise-env-and-themes.sh'
      - '.config/mise/config.toml'
      - '.config/kilo/themes/**'
      - '.config/opencode/themes/**'
      - '.github/workflows/check-mise-env-and-themes.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq
      - name: Verify dotfiles table has the adhd theme entries
        # Belt-and-suspenders alongside the symlink-resolution check: a PR
        # that removes the [dotfiles] table entry (e.g. someone
        # rationalising tracked files) leaves the symlink without a
        # source, and the per-file check below would silently pass on a
        # fresh runner that has no symlink at all.
        run: |
          set -euo pipefail
          for path in \
              '~/.config/opencode/themes/adhd.json' \
              '~/.config/kilo/themes/adhd.json'; do
              if ! grep -F "\"$path\"" .config/mise/config.toml >/dev/null; then
                  echo "  $path missing from [dotfiles] table" >&2
                  exit 1
              fi
          done
      - name: Verify tracked theme JSON
        # In --tracked-only mode the script resolves the dotfiles root
        # from its own path. `actions/checkout` places the repo at
        # $GITHUB_WORKSPACE, so the script sees
        # $GITHUB_WORKSPACE/scripts/check-mise-env-and-themes.sh and
        # derives the root from that.
        run: bash scripts/check-mise-env-and-themes.sh --tracked-only
