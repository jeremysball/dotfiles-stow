[project]
name = "serper"
version = "0.1.0"
description = "Google Search API via Serper.dev - web search, news, images, and knowledge graph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
serper = "serper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/serper"]

[dependency-groups]
dev = []
