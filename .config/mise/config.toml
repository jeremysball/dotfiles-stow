# Global mise config, symlinked to ~/.config/mise/config.toml by mise's own
# dotfiles feature (see the [dotfiles] table below).
#
# Scope: everything user-space. Pacman keeps only system packages and the
# two exceptions noted below.
#
# Deliberately NOT here:
#   fish     - login shell, must live in /etc/shells
#   ripgrep  - hard dependency of the pacman `opencode` package
#   opencode - pulls ripgrep with it; the two move together or not at all
#   grc      - ships /etc/grc.fish, which config.fish sources by absolute path
#   ghc/cabal/hls - ghcup already manages these well, and manages six GHC
#                   versions side by side. mise installs ghcup, not the toolchain.
#   ttf-nerd-fonts-symbols-mono, discount, texlive-plaingeneric, ispell - Doom
#     Emacs deps with no mise backend at all (fonts, a TeX Live package group,
#     a non-registry CLI, a spell checker). Reproduce via `mise-sys
#     doom-emacs-extras`.
#
# Install/bootstrap tasks (install-secrets, install-dotclaude,
# install-serper-axi, secrets-sync, etc.) live in the separate
# jeremysball/mise-en-system repo, not in this file's [tasks] table -- this
# config is loaded globally by mise (required so [tools] lands on PATH from
# any directory), and a global [tasks] table would leak into every other
# project's `mise tasks`. Run them with `mise-sys <task>` (a fish function
# wrapping `mise -C ~/projects/mise-en-system run <task>`) or `mise -C
# ~/projects/mise-en-system run <task>` directly. For secret updates use
# `mise-sys secrets-sync` (pulls both repos and re-links), not re-running
# `install-secrets` which only clones.

[tools]
# core CLI, referenced by fish abbrs and aliases
eza    = "latest"
bat    = "latest"
fd     = "latest"
zoxide = "latest"
fzf    = "latest"
jq     = "latest"
yq     = "latest"

# editors
neovim = "latest"

# git
gh      = "latest"
lazygit = "latest"
delta   = "latest"

# runtimes. Pin these per machine in ~/.config/mise/conf.d/ if they need to differ.
node   = "latest"
go     = "latest"
python = "latest"
uv     = "latest"

# llm shell pipe tool. Not in mise's registry under a bare `mods` name, so
# the aqua backend is named explicitly.
"aqua:charmbracelet/mods" = "latest"

# charmbracelet gum — beautiful shell scripts (gum style/spin/log) used by init.sh
# when available; init.sh falls back to plain echo if not yet installed (fresh machine).
gum = "latest"

# haskell: manage the manager, not the toolchain
ghcup = "latest"

# mise's own shell-completion generator; without it mise prints a warning
# that completions won't work
usage = "latest"

# generic multi-shell completion generator; provides fish completions for
# hundreds of CLIs that don't ship their own
carapace = "latest"

# fun — fortune feeds fish_greeting, cowsay/catbow decorate it
cowsay = "latest"
# catbow — installed from source via go: backend so the binary is `catbow`
# (the github release asset is `cb-v1.0.1-linux-amd64.tar.gz` containing a
# binary named `cb`, not `catbow`, so the github backend installs `cb` and
# `mise which catbow` fails with "No executable found"). Using go: builds
# from github.com/jeremysball/catbow and produces the correct `catbow` name.
"go:github.com/jeremysball/catbow" = "latest"

# AUR helper — not in Arch's official repos, so `sudo pacman -S yay` would
# fail. Mise pulls the prebuilt binary from GitHub releases (Jguer/yay) with
# no build step, matching how other prebuilt tools are managed here.
"github:Jguer/yay" = "latest"

[settings]
# Read .nvmrc / .python-version / .go-version in repos that never heard of mise
idiomatic_version_file_enable_tools = ["node", "python", "go"]
experimental = true

# The mise-en-system repo (see the [tasks] header comment above). Declaring
# it here lets `mise bootstrap repos apply` clone/converge it instead of
# init.sh hand-rolling clone-or-pull: mise clones it if missing and pulls
# only when the checkout is clean and origin matches, leaving a dirty or
# diverged checkout alone rather than failing the whole bootstrap.
[bootstrap.repos]
"~/projects/mise-en-system" = { url = "https://github.com/jeremysball/mise-en-system.git" }

# Every file this repo manages, symlinked from ~/.dotfiles (the default
# dotfiles.root) into place by `mise bootstrap dotfiles apply`. Every entry
# is one of:
#   - a single file (mode omitted, the default `symlink`)
#   - `mode = "symlink-each"`, for a directory a runtime tool writes into
#     (fisher/tide in fish/functions, fish/conf.d, fish/completions; also
#     .local/bin, since a few of those scripts are dangling symlinks that
#     only resolve on specific machines -- see below). It symlinks only the
#     files that exist in the repo's copy of the directory, so anything a
#     tool writes straight into the live directory is left alone, and a
#     source that doesn't resolve on this machine is skipped rather than
#     failing the whole apply the way a plain `= {}` entry would.
#   - `mode = "symlink"` on a whole directory, for the four git submodules
#     (alacritty-theme, zsh-autosuggestions, zsh-syntax-highlighting,
#     powerlevel10k), since nothing writes into an external theme/plugin
#     checkout at runtime. Submodules aren't checked out by a plain
#     `git clone` though -- run `git submodule update --init --recursive`
#     first (init.sh does this for you), or those four entries symlink
#     empty directories.
#
# A machine that does not want a given target (the graphical-workstation
# section below, for instance) just does not need those entries applied --
# either strip them locally before applying, or leave them: an unapplied
# entry with no source machine state does nothing until you `mise bootstrap
# dotfiles add` it for real.
[dotfiles]
# fish. completions/conf.d/functions use symlink-each: it symlinks only the
# files that exist in the repo's copy of each directory, so a file fisher or
# tide writes directly into the live directory (never into the repo) is left
# alone untouched. Same guarantee as one entry per file, far fewer lines, and
# a new file added to one of these three directories is picked up on the next
# apply without an extra table edit.
"~/.config/fish/completions" = { mode = "symlink-each" }
"~/.config/fish/conf.d" = { mode = "symlink-each" }
"~/.config/fish/functions" = { mode = "symlink-each" }
"~/.config/fish/config.fish" = {}
"~/.config/fish/fish_plugins" = {}

# mise (this file too)
"~/.config/mise/config.toml" = {}

# nvim
"~/.config/nvim/.gitignore" = {}
"~/.config/nvim/.neoconf.json" = {}
"~/.config/nvim/LICENSE" = {}
"~/.config/nvim/README.md" = {}
"~/.config/nvim/init.lua" = {}
"~/.config/nvim/lazy-lock.json" = {}
"~/.config/nvim/lazyvim.json" = {}
"~/.config/nvim/lua/config/autocmds.lua" = {}
"~/.config/nvim/lua/config/keymaps.lua" = {}
"~/.config/nvim/lua/config/lazy.lua" = {}
"~/.config/nvim/lua/config/options.lua" = {}
"~/.config/nvim/lua/plugins/99.lua" = {}
"~/.config/nvim/lua/plugins/example.lua" = {}
"~/.config/nvim/stylua.toml" = {}

# doom
"~/.config/doom/config.el" = {}
"~/.config/doom/init.el" = {}
"~/.config/doom/packages.el" = {}

# bin scripts. symlink-each also means gf2/libregate/pico8/speedcat (dangling
# symlinks to tool paths that only exist on the machine that has those
# tools -- see the [dotfiles] header comment) are silently skipped on a
# machine that doesn't have them, instead of failing the whole apply the way
# an individual `= {}` entry does.
"~/.local/bin" = { mode = "symlink-each" }

# fonts. MonoLisaNerdFontMono-Regular.otf is the patched terminal/editor font
# itself, not a fontconfig setting -- reproduce or refresh it via
# `mise-sys monolisa-nerd-font-patch`.
"~/.config/fontconfig/fonts.conf" = {}
"~/.local/share/fonts/MonoLisaNerdFontMono-Regular.otf" = {}

# bash
"~/.bashrc" = {}

# git
"~/.config/git/ignore" = {}
"~/.gitconfig" = {}

# gh
"~/.config/gh/config.yml" = {}
"~/.config/gh/pat-switcher.sh" = {}

# systemd
"~/.config/systemd/user/bumblebee-nightly.service" = {}
"~/.config/systemd/user/bumblebee-nightly.timer" = {}
"~/.config/systemd/user/bifrost.service" = {}

# zellij, htop, superfile, himalaya, alfred, taskferry, mcporter
"~/.config/alfred/config.toml" = {}
"~/.config/himalaya/config.toml" = {}
"~/.config/htop/htoprc" = {}
"~/.config/mcporter/config.json" = {}
"~/.config/superfile/compact.toml" = {}
"~/.config/superfile/config.toml" = {}
"~/.config/superfile/hotkeys.toml" = {}
"~/.config/taskferry/config.json" = {}
"~/.config/zellij/config.kdl" = {}

# older graphical workstation: i3, xorg, picom, alacritty, helix, zsh, tmux
"~/.config/alacritty/alacritty-theme" = {}  # submodule, whole-dir symlink
"~/.config/alacritty/alacritty.toml" = {}
"~/.config/helix/config.toml" = {}
"~/.config/helix/ignore" = {}
"~/.config/helix/languages.toml" = {}
"~/.config/i3/config" = {}
"~/.config/picom.conf" = {}
"~/.tmux.conf" = {}
"~/.xinitrc" = {}
"~/.xprofile" = {}
"~/.zsh/aliases" = {}
"~/.zsh/custom/plugins/zsh-autosuggestions" = {}  # submodule, whole-dir symlink
"~/.zsh/custom/plugins/zsh-syntax-highlighting" = {}  # submodule, whole-dir symlink
"~/.zsh/custom/themes/linuxonly-purple.zsh-theme" = {}
"~/.zsh/custom/themes/powerlevel10k" = {}  # submodule, whole-dir symlink
"~/.zsh/functions/e" = {}
"~/.zsh/functions/edit.sh" = {}
"~/.zshrc" = {}
"~/.zshrc.local" = {}

# haskell (cabal, ghcup config -- the ghc toolchain itself stays unmanaged
# per the [tools] header comment, ghcup owns it)
"~/.config/cabal/config" = {}
"~/.config/ghcup/config.yaml" = {}

# bumblebee-nightly (config only; the systemd service/timer pair is tracked
# above alongside bumblebee-nightly.{service,timer})
"~/.config/bumblebee-nightly/config" = {}

# bifrost -- config.json only. The unit is tracked above alongside
# bifrost.service. Lives under ~/.local/state because the app also writes
# its own sqlite state/log databases into the same directory; the env file
# with the actual provider keys is never tracked here, regenerate it via
# `mise-sys install-bifrost`, which pulls from global.env.
"~/.local/state/bifrost/config.json" = {}

# herdr -- config.toml only. herdr-client.log, herdr-server.log,
# session.json, release-notes.json are runtime state, not config, and
# deliberately not tracked here.
"~/.config/herdr/config.toml" = {}

# mods
"~/.config/mods/mods.yml" = {}

# playwright-mcp
"~/.config/playwright-mcp/config.json" = {}

# tmux -- local override layered on ~/.tmux.conf above
"~/.config/tmux/tmux.conf.local" = {}

# opencode -- config only. meta-api-key is a live credential; node_modules,
# package.json/package-lock.json are installed deps; backups-2026-07-17/ is
# a stale snapshot. None of those four are tracked.
"~/.config/opencode/opencode.json" = {}
"~/.config/opencode/opencode.jsonc" = {}
"~/.config/opencode/tui.json" = {}
"~/.config/opencode/agent/hermes.md" = {}
"~/.config/opencode/agents/notools-luna.md" = {}
"~/.config/opencode/agents/notools-sol.md" = {}
"~/.config/opencode/agents/notools-terra.md" = {}
"~/.config/opencode/plugins/herdr-agent-state.js" = {}

# kilo -- its own kilo.jsonc exposes claude-code plugin skills via skills.paths
"~/.config/kilo/kilo.jsonc" = {}

